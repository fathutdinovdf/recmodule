<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стенд геометрии карточки</title>
  <style>
    /* Кадр ровно того размера, в котором снимаются скриншоты: геометрия
       зависит от ширины окна, и мерить надо в том же кадре, иначе перенос
       строки то появляется, то исчезает от прогона к прогону. */
    iframe { width: 1600px; height: 1100px; border: 0; }
    body { margin: 0; }
  </style>
</head>
<body>
<div id="кадры"></div>
<pre id="итог">стенд не отработал</pre>

<script>
/* Есть класс дефектов, который не виден ни в разметке, ни в CSS по отдельности:
   значение переносится по строкам, потому что рядом оказался длинный сосед.
   Номер рекомендации «ДР-26-0025», разорванный на «ДР-26-» и «0025», перестаёт
   читаться и не ищется глазами — но в DOM он остаётся одной строкой, а в CSS
   всё выглядит корректно. Единственный способ поймать это без человека —
   спросить у браузера геометрию: сколько прямоугольников занимает текст.

   Карточка открывается в кадре, а не измеряется на самой странице, потому что
   мерить надо готовый макет как есть, ничего в нём не подменяя. */

const итог = { кадров: 0, переносы: [], переполнение: [], ошибки: [] };

/* Значения, которые человек ищет глазами как единое целое и которые перенос
   строки делает нечитаемыми: номер рекомендации (решение 17) и дата. */
const НЕРАЗРЫВНОЕ = /^([А-ЯЁA-Z]{2,3}\d?-\d{2}-\d{4}|\d{2}\.\d{2}\.\d{4})$/;

const адреса = decodeURIComponent(location.hash.slice(1)).split('|').filter(Boolean);

function кадр(адрес) {
  return new Promise((готово) => {
    const f = document.createElement('iframe');
    f.src = адрес;
    f.addEventListener('load', () => готово(f));
    f.addEventListener('error', () => готово(null));
    document.getElementById('кадры').appendChild(f);
  });
}

async function прогон() {
  for (const запись of адреса) {
    /* Адрес может нести за «@» селектор, по которому надо щёлкнуть после
       загрузки: шаги мастера в адресе не выражаются, мастер держит их в
       памяти. Без щелчка мерить можно было бы только первый шаг. */
    const [адрес, селектор] = запись.split('@');
    const f = await кадр(адрес);
    if (!f) { итог.ошибки.push(`кадр не загрузился: ${адрес}`); continue; }
    let док;
    try { док = f.contentDocument; } catch (e) { итог.ошибки.push(`нет доступа к кадру ${адрес}: ${e.name}`); continue; }
    if (!док) { итог.ошибки.push(`пустой кадр: ${адрес}`); continue; }
    if (селектор) {
      const цель = док.querySelector(селектор);
      if (!цель) { итог.ошибки.push(`в кадре ${адрес} нет элемента «${селектор}»`); continue; }
      цель.click();
      /* Таймером, а не requestAnimationFrame: под --virtual-time-budget кадры
         анимации браузер может не отдать, и стенд зависал бы на первом же
         ожидании, а прогон видел бы только «стенд не отработал». */
      await new Promise((r) => setTimeout(r, 0));
    }
    итог.кадров++;
    const метка = адрес.replace(/^.*\/([^/]+)$/, '$1') + (селектор ? ` @${селектор}` : '');

    for (const э of док.querySelectorAll('*')) {
      if (э.children.length) continue;                 // мерим только листья с текстом
      const текст = (э.textContent || '').trim();
      if (!НЕРАЗРЫВНОЕ.test(текст)) continue;
      /* Мерим диапазон по содержимому, а не сам элемент: элемент внутри
         flex-контейнера становится блоком, и разорванный текст даёт у него
         один-единственный прямоугольник — перенос не виден. Диапазон же
         возвращает по прямоугольнику на каждую строку независимо от того,
         блок это или строчный элемент. */
      const д = док.createRange();
      д.selectNodeContents(э);
      const строк = д.getClientRects().length;
      if (строк > 1) {
        итог.переносы.push({ где: метка, значение: текст, класс: э.className || э.tagName.toLowerCase(),
          родитель: (э.parentElement && э.parentElement.className) || '', строк });
      }
    }

    /* Карточка занимает ширину окна и горизонтально прокручиваться не должна:
       горизонтальная полоса на карточке всегда означает, что что-то не влезло. */
    const к = док.documentElement;
    if (к.scrollWidth > к.clientWidth + 1) {
      итог.переполнение.push({ где: метка, ширина: к.scrollWidth, окно: к.clientWidth });
    }
  }
  document.getElementById('итог').textContent = JSON.stringify(итог, null, 1);
}

прогон();
</script>
</body>
</html>
