<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стенд выпадающего списка мастера</title>
  <style>
    iframe { width: 1600px; height: 1100px; border: 0; }
    body { margin: 0; }
  </style>
</head>
<body>
<div id="кадры"></div>
<pre id="итог">стенд не отработал</pre>

<script>
/* Выпадающий список мастера — собственный компонент, а не `select`: у него нет
   ни встроенного поведения браузера, ни разметки, по которой это поведение
   можно было бы проверить статически. Всё, что он делает, он делает в ответ на
   события, поэтому единственный способ проверить его без человека — открыть
   мастер в кадре и подавать те же события, что подают мышь и клавиатура.

   Проверяется ровно то, что уже ломалось или может сломаться молча:
   1. список раскрывается по нажатию на поле;
   2. набор текста фильтрует, и в остатке только подходящие строки — отдельно
      для двух способов открытия: мышью и первым символом с клавиатуры;
   3. ПОВТОРНОЕ открытие после выбора снова показывает весь список. Это и был
      дефект, который чинили: поле хранит выбранное значение, и пока оно
      считалось строкой поиска, список при втором открытии схлопывался до
      одного пункта — того, что и так выбран. Без этого пункта проверка
      бессмысленна: на сломанной версии остальные проходили;
   4. Escape возвращает в поле выбранное значение, а не обрывок строки поиска,
      который читался бы как значение;
   5. каскад: до выбора месторождения поле скважины закрыто, после — показывает
      ровно столько скважин, сколько обещала подпись у месторождения.

   Справочники в data.js объявлены через const, то есть в глобальную область
   объекта window не попадают и снаружи кадра не видны. Поэтому эталон берётся
   не из данных, а из самого списка при первом открытии: проверка сравнивает
   поведение с поведением, а состав справочника сверяет отдельная проверка. */

const итог = { шагов: 0, ошибки: [], замеры: {} };

function кадр(адрес) {
  return new Promise((готово) => {
    const f = document.createElement('iframe');
    f.src = адрес;
    f.addEventListener('load', () => готово(f));
    f.addEventListener('error', () => готово(null));
    document.getElementById('кадры').appendChild(f);
  });
}

/* Пауза именно таймером, а не requestAnimationFrame: под --virtual-time-budget
   кадры анимации браузер может не отдать вовсе, и стенд молча зависал бы на
   первом же ожидании. Перерисовка мастера синхронная, ждать нечего — пауза
   нужна только чтобы дать очереди событий провернуться. */
const пауза = () => new Promise((r) => setTimeout(r, 0));

async function прогон() {
  const f = await кадр('../макет/wizard.html');
  if (!f) { итог.ошибки.push('кадр мастера не загрузился'); return; }
  let док;
  try { док = f.contentDocument; } catch (e) { итог.ошибки.push('нет доступа к кадру: ' + e.name); return; }
  const окно = f.contentWindow;

  /* Компонент открывается по mousedown, а не по click: click прилетает после
     blur, и список успевал бы закрыться раньше выбора. Подаём то же событие. */
  const нажать = (э) => э.dispatchEvent(new окно.MouseEvent('mousedown', { bubbles: true, cancelable: true }));
  const клавиша = (э, key) => э.dispatchEvent(new окно.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
  const поле = (ключ) => док.querySelector('#c-' + ключ);
  const меню = () => [...док.querySelectorAll('.combo__menu .combo__opt')];
  const пункты = () => меню().map((э) => (э.querySelector('.combo__txt') || э).textContent.trim());
  const открыт = () => !!док.querySelector('.combo.is-open .combo__menu:not([hidden])');

  if (!поле('field')) { итог.ошибки.push('на первом шаге мастера нет поля месторождения (#c-field)'); return; }

  /* Скважина до выбора месторождения выбираться не должна: список скважин
     у каждого узла свой, и выбранный «в пустоту» номер молча соврал бы. */
  итог.шагов++;
  if (!поле('well') || !поле('well').disabled) {
    итог.ошибки.push('поле скважины доступно до выбора месторождения');
  }

  /* 1. открытие мышью */
  нажать(поле('field'));
  await пауза();
  итог.шагов++;
  if (!открыт()) итог.ошибки.push('список месторождений не раскрылся по нажатию на поле');
  const весь = пункты();
  итог.замеры.приПервомОткрытии = весь.length;
  if (весь.length < 2) итог.ошибки.push(`при первом открытии в списке ${весь.length} пунктов — это не список`);

  /* 2а. фильтрация набором текста в уже раскрытом списке */
  const образец = (весь[0] || '').slice(0, 3).toLowerCase();
  const эл = поле('field');
  эл.value = образец;
  эл.dispatchEvent(new окно.Event('input', { bubbles: true }));
  await пауза();
  итог.шагов++;
  const мышью = пункты();
  итог.замеры.фильтрПослеОткрытияМышью = `«${образец}» → ${мышью.length} из ${весь.length}`;
  const подходят = весь.filter((s) => s.toLowerCase().includes(образец)).length;
  if (мышью.length !== подходят) {
    итог.ошибки.push(`список открыт мышью, набрано «${образец}»: показано ${мышью.length} пунктов из ${весь.length}, `
      + `а подходят под запрос ${подходят} — набор текста не фильтрует`);
  }

  /* 2б. тот же фильтр, но список открыт первым символом с клавиатуры */
  клавиша(эл, 'Escape');
  await пауза();
  поле('field').focus();
  клавиша(поле('field'), образец[0]);
  await пауза();
  итог.шагов++;
  const склавиатуры = пункты();
  const подходятОдин = весь.filter((s) => s.toLowerCase().includes(образец[0])).length;
  итог.замеры.фильтрПослеОткрытияСКлавиатуры = `«${образец[0]}» → ${склавиатуры.length} из ${весь.length}`;
  if (склавиатуры.length !== подходятОдин) {
    итог.ошибки.push(`список открыт символом «${образец[0]}» с клавиатуры: показано ${склавиатуры.length}, `
      + `а подходят ${подходятОдин}`);
  }

  /* 3. выбор пункта и повторное открытие — тот самый дефект */
  клавиша(поле('field'), 'Escape');
  await пауза();
  нажать(поле('field'));
  await пауза();
  const цель = меню()[0];
  const обещано = цель && цель.querySelector('.combo__note')
    ? Number((цель.querySelector('.combo__note').textContent.match(/\d+/) || [0])[0]) : null;
  const выбрано = цель ? (цель.querySelector('.combo__txt') || цель).textContent.trim() : '';
  if (цель) нажать(цель);
  await пауза();
  итог.шагов++;
  итог.замеры.выбрано = выбрано;
  if (открыт()) итог.ошибки.push('после выбора список остался раскрытым');
  if (поле('field').value !== выбрано) {
    итог.ошибки.push(`после выбора в поле «${поле('field').value}», а выбирали «${выбрано}»`);
  }

  нажать(поле('field'));
  await пауза();
  итог.шагов++;
  const повторно = пункты();
  итог.замеры.приПовторномОткрытии = повторно.length;
  if (повторно.length !== весь.length) {
    итог.ошибки.push(`при повторном открытии список схлопнулся до ${повторно.length} из ${весь.length}: `
      + 'выбранное значение снова считается строкой поиска');
  }

  /* 4. Escape возвращает выбранное значение, а не строку поиска */
  const п = поле('field');
  п.value = 'ю';
  п.dispatchEvent(new окно.Event('input', { bubbles: true }));
  await пауза();
  клавиша(п, 'Escape');
  await пауза();
  итог.шагов++;
  if (открыт()) итог.ошибки.push('Escape не закрыл список');
  if (поле('field').value !== выбрано) {
    итог.ошибки.push(`после Escape в поле осталась строка поиска «${поле('field').value}», `
      + `а не выбранное значение «${выбрано}»`);
  }

  /* 5. каскад: скважин ровно столько, сколько обещала подпись у месторождения */
  if (!поле('well') || поле('well').disabled) {
    итог.ошибки.push('после выбора месторождения поле скважины осталось закрытым');
  } else {
    нажать(поле('well'));
    await пауза();
    итог.шагов++;
    const скважины = пункты();
    итог.замеры.скважинПоказано = скважины.length;
    итог.замеры.скважинОбещано = обещано;
    if (!скважины.length) итог.ошибки.push('после выбора месторождения список скважин пуст');
    else if (обещано !== null && скважины.length !== обещано) {
      итог.ошибки.push(`у месторождения «${выбрано}» подпись обещает ${обещано} скважин, `
        + `а список показывает ${скважины.length}`);
    }
  }
}

function вывод() {
  document.getElementById('итог').textContent = JSON.stringify(итог, null, 1);
}

/* Упавший стенд обязан отдать причину: без этого прогон видит только «стенд не
   отработал», и разбираться приходится вручную. */
прогон().catch((e) => { итог.ошибки.push(`стенд упал: ${e && e.message}`); }).then(вывод);
</script>
</body>
</html>
