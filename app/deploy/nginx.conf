# Reverse-proxy на Next.js (порт 3100). Сертификат — готовый DomainSSL от
# reg.ru (GlobalSign DV), не Let's Encrypt: их certbot --nginx (HTTP-01) и
# DNS-01 оба не проходили из этой сети, см. BRIEF.md. Файлы уже лежат в
# /etc/nginx/ssl/ (deploy/setup-vm-tls-regru.sh их туда кладёт).
server {
    listen 80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/nginx/ssl/DOMAIN.fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/DOMAIN.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE-лента обсуждения (rec/[id]) держит соединение открытым дольше
        # дефолтных 60с — без этого прокси рвёт его посреди чтения.
        proxy_read_timeout 1h;
    }
}
