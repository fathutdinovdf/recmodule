# Reverse-proxy на Next.js (порт 3100). Заменить DOMAIN на реальный домен,
# затем: certbot --nginx -d DOMAIN сам допишет server{} на 443 и редирект с 80.
server {
    listen 80;
    server_name DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE-лента обсуждения (rec/[id]) держит соединение открытым дольше
        # дефолтных 60с — без этого прокси рвёт его посреди чтения.
        proxy_read_timeout 1h;
    }
}
