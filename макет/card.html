<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточка рекомендации</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="registry.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>

<svg style="display:none">
  <symbol id="i-bell" viewBox="0 0 16 16"><path d="M8 2a3.5 3.5 0 0 0-3.5 3.5c0 3-1 4-1 4h9s-1-1-1-4A3.5 3.5 0 0 0 8 2zM6.6 12a1.5 1.5 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-help" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.4 6.2A1.7 1.7 0 0 1 9.7 6.6c0 1.2-1.7 1.4-1.7 2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".7" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.5 3.5 5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.7V8l2.4 1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><circle cx="8" cy="3.4" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.6" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-clip" viewBox="0 0 16 16"><path d="M10.5 5.5 6.2 9.8a1.7 1.7 0 0 0 2.4 2.4l4.6-4.6a3 3 0 0 0-4.2-4.2L4.2 8.2a4.3 4.3 0 0 0 6 6l3.6-3.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-1 1M9.5 6.5a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l1-1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
</svg>

<header class="appbar">
  <div class="appbar__group appbar__group--right">
    <button class="iconbtn iconbtn--lg" title="Уведомления"><svg class="ic20"><use href="#i-bell"/></svg><span class="dot"></span></button>
    <button class="iconbtn iconbtn--lg" title="Помощь"><svg class="ic20"><use href="#i-help"/></svg></button>
    <div class="user"><span class="avatar">ФД</span>Фатхутдинов Д.Ф.</div>
  </div>
</header>

<div class="layout">
  <nav class="sidenav">
    <div class="sidenav__section">Работа</div>
    <a class="navitem" href="inbox.html"><span class="navitem__label">Мои задачи</span><span class="badge badge--accent">7</span></a>
    <a class="navitem is-active" href="index.html"><span class="navitem__label">Реестр рекомендаций</span></a>
    <a class="navitem"><span class="navitem__label">Заявки Заказчика</span><span class="badge">2</span></a>
    <div class="sidenav__section">Эффект</div>
    <a class="navitem navitem--muted"><span class="navitem__label">Окна эффекта</span></a>
    <a class="navitem navitem--muted"><span class="navitem__label">Подтверждённые</span></a>
    <div class="sidenav__section">Настройка</div>
    <a class="navitem"><span class="navitem__label">Справочники</span></a>
    <a class="navitem"><span class="navitem__label">Пользователи и роли</span></a>
    <a class="navitem"><span class="navitem__label">Календарь и SLA</span></a>
    <a class="navitem"><span class="navitem__label">Отчёты и выгрузки</span></a>
  </nav>

  <main class="content content--card">
    <div class="cardhead" id="cardhead"></div>
    <div class="forecast" id="forecast"></div>

    <div class="cardbody">
      <section class="panel panel--main">
        <div class="tabs" id="tabs"></div>
        <div class="tabpane" id="tabpane"></div>
      </section>
      <aside class="context" id="context"></aside>
    </div>
  </main>
</div>

<script src="вмап.js"></script>
<script src="data.js"></script>
<script src="card.js"></script>
</body>
</html>
