<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реестр рекомендаций — модуль управления мероприятиями</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="registry.css">
</head>
<body>

<svg style="display:none">
  <symbol id="i-sort" viewBox="0 0 12 12"><path d="M6 2.5v7M6 9.5 3.8 7.3M6 9.5l2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-funnel" viewBox="0 0 12 12"><path d="M1.5 2.5h9L7 6.4v3.1L5 10.5V6.4z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m10.2 10.2 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 16 16"><path d="M8 2a3.5 3.5 0 0 0-3.5 3.5c0 3-1 4-1 4h9s-1-1-1-4A3.5 3.5 0 0 0 8 2zM6.6 12a1.5 1.5 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-help" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.4 6.2A1.7 1.7 0 0 1 9.7 6.6c0 1.2-1.7 1.4-1.7 2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".7" fill="currentColor"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-cols" viewBox="0 0 16 16"><rect x="2.2" y="3" width="11.6" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.1 3v10M9.9 3v10" stroke="currentColor" stroke-width="1.2"/></symbol>
  <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 10.5V2.8M8 2.8 5.6 5.2M8 2.8l2.4 2.4M3 10v2.2c0 .6.4 1 1 1h8c.6 0 1-.4 1-1V10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="appbar">
  <div class="appbar__group appbar__group--right">
    <button class="iconbtn iconbtn--lg" title="Уведомления"><svg class="ic20"><use href="#i-bell"/></svg><span class="dot"></span></button>
    <button class="iconbtn iconbtn--lg" title="Помощь"><svg class="ic20"><use href="#i-help"/></svg></button>
    <div class="user"><span class="avatar">ФД</span>Фатхутдинов Д.Ф.</div>
  </div>
</header>

<div class="layout">
  <nav class="sidenav">
    <div class="sidenav__section">Работа</div>
    <a class="navitem" href="inbox.html"><span class="navitem__label">Мои задачи</span><span class="badge badge--accent">7</span></a>
    <a class="navitem is-active"><span class="navitem__label">Реестр рекомендаций</span></a>
    <a class="navitem"><span class="navitem__label">Заявки Заказчика</span><span class="badge">2</span></a>
    <div class="sidenav__section">Эффект</div>
    <a class="navitem navitem--muted"><span class="navitem__label">Окна эффекта</span></a>
    <a class="navitem navitem--muted"><span class="navitem__label">Подтверждённые</span></a>
    <div class="sidenav__section">Настройка</div>
    <a class="navitem"><span class="navitem__label">Справочники</span></a>
    <a class="navitem"><span class="navitem__label">Пользователи и роли</span></a>
    <a class="navitem"><span class="navitem__label">Календарь и SLA</span></a>
    <a class="navitem"><span class="navitem__label">Отчёты и выгрузки</span></a>
  </nav>

  <main class="content">
    <div class="pagehead">
      <h1>Реестр рекомендаций</h1>
      <div class="pagehead__actions">
        <button class="btn btn--accent"><svg class="ic16"><use href="#i-plus"/></svg>Создать рекомендацию</button>
        <button class="iconbtn iconbtn--lg" id="btnCols" title="Настройка колонок"><svg class="ic20"><use href="#i-cols"/></svg></button>
        <button class="iconbtn iconbtn--lg" title="Экспорт"><svg class="ic20"><use href="#i-export"/></svg></button>
      </div>
    </div>

    <section class="tiles" id="tiles"></section>

    <section class="panel">
      <div class="tablewrap">
        <table class="tbl" id="tbl">
          <colgroup id="cg"></colgroup>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="pager">
        <div class="pager__info" id="pagerInfo"></div>
        <button class="btn btn--ghost btn--small" id="btnReset" hidden>Сбросить фильтры</button>
        <div class="pager__pages" id="pagerPages"></div>
        <label class="field field--compact"><select id="pageSize">
          <option>25</option><option selected>50</option><option>100</option>
        </select></label>
      </div>
    </section>
  </main>
</div>

<div class="popover" id="popover" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
