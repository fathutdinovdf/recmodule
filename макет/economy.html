<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Экономическая модель — модуль управления рекомендациями</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="registry.css">
  <link rel="stylesheet" href="economy.css">
</head>
<body>

<svg style="display:none">
  <symbol id="i-bell" viewBox="0 0 16 16"><path d="M8 2a3.5 3.5 0 0 0-3.5 3.5c0 3-1 4-1 4h9s-1-1-1-4A3.5 3.5 0 0 0 8 2zM6.6 12a1.5 1.5 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-help" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.4 6.2A1.7 1.7 0 0 1 9.7 6.6c0 1.2-1.7 1.4-1.7 2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".7" fill="currentColor"/></symbol>
  <symbol id="i-history" viewBox="0 0 16 16"><path d="M3.2 8a4.8 4.8 0 1 0 1.6-3.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M2.6 2.6v2.6h2.6M8 5.1V8l2.1 1.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.8" y="7" width="8.4" height="6.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.8 7V5.4a2.2 2.2 0 0 1 4.4 0V7" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.6 8.4 3 3 5.8-6.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="appbar">
  <div class="appbar__group appbar__group--right">
    <button class="iconbtn iconbtn--lg" title="Уведомления"><svg class="ic20"><use href="#i-bell"/></svg><span class="dot"></span></button>
    <button class="iconbtn iconbtn--lg" title="Помощь"><svg class="ic20"><use href="#i-help"/></svg></button>
    <div class="user"><span class="avatar">ФД</span>Фатхутдинов Д.Ф.</div>
  </div>
</header>

<div class="layout">
  <nav class="sidenav">
    <div class="sidenav__section">Работа</div>
    <a class="navitem" href="inbox.html"><span class="navitem__label">Мои задачи</span><span class="badge badge--accent">7</span></a>
    <a class="navitem" href="index.html"><span class="navitem__label">Реестр рекомендаций</span></a>
    <a class="navitem" href="claims.html"><span class="navitem__label">Заявки Заказчика</span><span class="badge">2</span></a>
    <div class="sidenav__section">Эффект</div>
    <a class="navitem navitem--muted"><span class="navitem__label">Окна эффекта</span></a>
    <a class="navitem navitem--muted"><span class="navitem__label">Подтверждённые</span></a>
    <div class="sidenav__section">Настройка</div>
    <a class="navitem" href="refs.html"><span class="navitem__label">Справочники</span></a>
    <a class="navitem is-active" href="economy.html"><span class="navitem__label">Экономическая модель</span></a>
    <a class="navitem" href="users.html"><span class="navitem__label">Пользователи и роли</span></a>
    <a class="navitem" href="sla.html"><span class="navitem__label">Календарь и SLA</span></a>
    <a class="navitem navitem--muted"><span class="navitem__label">Отчёты и выгрузки</span></a>
  </nav>

  <main class="content content--economy">
    <div class="pagehead">
      <h1>Экономическая модель</h1>
      <div class="pagehead__actions">
        <button class="btn" id="btnHistory"><svg class="ic16"><use href="#i-history"/></svg>История изменений</button>
      </div>
    </div>

    <div class="econworkspace">
      <section class="panel econpanel" aria-labelledby="econTitle">
        <header class="econhead">
          <div class="econhead__top">
            <div class="seg" role="tablist" aria-label="Раздел экономической модели">
              <button class="seg__b" role="tab" data-tab="global">Общие параметры</button>
              <button class="seg__b is-on" role="tab" data-tab="rates">Ставки по месторождениям</button>
              <button class="seg__b" role="tab" data-tab="ndpi">НДПИ по пластам</button>
            </div>
            <div class="econaccess" id="econAccess"></div>
          </div>
          <div class="econhead__title" id="econTitle"></div>
        </header>

        <div class="econcontent" id="econContent"></div>
        <footer class="dirtybar" id="dirtyBar" hidden></footer>
      </section>

      <aside class="econdrawer" id="econDrawer" hidden aria-labelledby="drawerTitle"></aside>
    </div>
  </main>
</div>

<script src="вмап.js"></script>
<script src="data.js"></script>
<script src="economy.js"></script>
</body>
</html>
